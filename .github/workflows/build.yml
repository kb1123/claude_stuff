name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog build.log \
            --title "Latest build log" \
            --notes "Compiler output of the most recent build" \
            --prerelease \
            --target "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperZoom-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SuperZoom.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SuperZoom.apk \
            --title "Super Zoom (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
